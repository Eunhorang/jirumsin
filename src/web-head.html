<script>
/* 내 방문 제외: 주소에 ?notrack=1을 붙여 열면 이 브라우저의 방문이 Umami 통계에서 빠지고, ?notrack=0이면 다시 잡힌다.
   Umami가 'umami.disabled'를 읽기 전에 저장해야 링크를 연 그 방문부터 빠지므로 Umami 스크립트보다 앞에 둔다. */
(() => {
  const v = new URLSearchParams(location.search).get('notrack');
  if (v === null) return;
  let msg = '';
  try {
    if (v === '1') { localStorage.setItem('umami.disabled', '1'); msg = '이 브라우저의 방문은 통계에서 빠져요'; }
    else if (v === '0') { localStorage.removeItem('umami.disabled'); msg = '이 브라우저의 방문도 다시 통계에 잡혀요'; }
  } catch (e) { /* 저장소를 쓸 수 없는 브라우저 */ }
  // notrack만 지우고 utm_ 같은 나머지 꼬리표와 # 뒷부분은 글자 그대로 남긴다
  const q = location.search.slice(1).split('&').filter(p => p.split('=')[0] !== 'notrack').join('&');
  history.replaceState(history.state, '', location.pathname + (q ? '?' + q : '') + location.hash);
  if (msg) document.addEventListener('DOMContentLoaded', () => {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => { if (t.textContent === msg) t.classList.remove('show'); }, 4000);
  });
})();
</script>
