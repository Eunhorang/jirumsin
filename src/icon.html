<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>지름신 퇴치소 홈 화면 아이콘</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=block&text=%ED%87%B4%EC%B9%98">
<style>
/* icon.sh가 이 페이지를 정사각형으로 찍어 휴대폰 홈 화면 아이콘을 만든다.
   크기는 모두 vw 단위라 어떤 크기로 찍어도 같은 모양이다. 안드로이드가 아이콘을 원이나 둥근 사각형으로
   잘라도(maskable) 도장이 잘리지 않도록 도장은 가운데 80% 원 안에 둔다. */
* { box-sizing: border-box; margin: 0; }
html, body { width: 100vw; height: 100vh; overflow: hidden; }
body { display: grid; place-items: center; background: #F2D04B; }
.seal {
  width: 60vw; height: 60vw; display: grid; place-items: center;
  background: #C42A20; color: #fff; border-radius: 7vw; transform: rotate(-5deg);
  box-shadow: inset 0 0 0 3.2vw #C42A20, inset 0 0 0 4.6vw #fff;
  font-family: "Black Han Sans"; font-size: 22vw; line-height: 1; letter-spacing: .04em;
  writing-mode: vertical-rl;
}
</style>
</head>
<body><div class="seal">퇴치</div></body>
</html>
